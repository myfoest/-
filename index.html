<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小人的一天 · 网络安全沉浸游戏</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

/* 开始界面 */
.start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
}

.start-screen h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.start-screen p {
    font-size: 1.2rem;
    color: #8892b0;
    margin-bottom: 2rem;
}

.start-btn {
    padding: 15px 50px;
    font-size: 1.2rem;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.start-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
}

/* 游戏主界面 */
.game-container {
    display: none;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

/* 顶部状态栏 */
.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: rgba(255,0.05);
    border-radius: 10px;
    margin-bottom: 20px;
}

.step-info {
    font-size: 1rem;
    color: #00d2ff;
}

.progress-bar {
    width: 200px;
    height: 8px;
    background: rgba(255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    transition: width 0.5s;
}

.risk-counter {
    color: #ff6b6b;
    font-weight: bold;
}

/* 场景卡片 */
.scene-card {
    background: rgba(255,255,0.05);
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,0.1);
    animation: fadeIn 0.5s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.scene-header {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

.scene-time {
    background: #3a7bd5;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 0.9rem;
    margin-right: 15px;
}

.scene-title {
    font-size: 1.5rem;
    color: #fff;
}

.scene-desc {
    font-size: 1rem;
    line-height: 1.8;
    color: #ccd6f6;
    margin-bottom: 20px;
}

/* 小人动画区域 */
.character-area {
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 30px;
    margin-bottom: 20px;
    text-align: center;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.character {
    font-size: 80px;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.action-text {
    font-size: 1.1rem;
    color: #8892b0;
}

/* 操作按钮 */
.action-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
}

.action-btn {
    padding: 12px 30px;
    border: 2px solid rgba(255,0.2);
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1rem;
}

.action-btn:hover {
    border-color: #00d2ff;
    background: rgba(0, 210, 255, 0.1);
}

.action-btn.risky {
    border-color: #ff6b6b;
}

.action-btn.safe {
    border-color: #51cf66;
}

/* 找茬窗口 */
.quiz-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.quiz-content {
    background: #16213e;
    border-radius: 15px;
    padding: 40px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    animation: popIn 0.3s;
}

@keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.quiz-icon {
    font-size: 60px;
    margin-bottom: 20px;
}

.quiz-question {
    font-size: 1.3rem;
    margin-bottom: 30px;
    line-height: 1.6;
}

.quiz-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.quiz-btn {
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s;
}

.quiz-btn.no-problem {
    background: linear-gradient(90deg, #51cf66, #40c057);
    color: white;
}

.quiz-btn.has-problem {
    background: rgba(255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,0.2);
}

.quiz-btn:hover {
    transform: scale(1.02);
}

/* 知识点卡片 */
.knowledge-card {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1001;
    align-items: center;
    justify-content: center;
}

.knowledge-content {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 15px;
    padding: 40px;
    max-width: 600px;
    width: 90%;
    border: 1px solid #ff6b6b;
}

.knowledge-title {
    color: #ff6b6b;
    font-size: 1.3rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.knowledge-text {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #ccd6f6;
    margin-bottom: 15px;
}

.knowledge-real {
    background: rgba(255, 107, 107, 0.1);
    padding: 15px;
    border-radius: 10px;
    border-left: 3px solid #ff6b6b;
    margin-bottom: 20px;
}

.knowledge-real h4 {
    color: #ff6b6b;
    margin-bottom: 10px;
}

.next-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.3s;
}

.next-btn:hover {
    transform: scale(1.02);
}

/* 结局画面 */
.ending-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
}

.ending-title {
    font-size: 2rem;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #ff6b6b, #ee5a24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.timeline {
    text-align: left;
    max-width: 600px;
    margin: 0 auto 40px;
}

.timeline-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(255,255,0.05);
    border-radius: 10px;
    border-left: 3px solid #ff6b6b;
}

.timeline-time {
    color: #ff6b6b;
    font-weight: bold;
    min-width: 60px;
}

.timeline-text {
    color: #ccd6f6;
    padding-left: 15px;
}

.ending-quote {
    font-size: 1.3rem;
    line-height: 1.8;
    color: #ccd6f6;
    margin-bottom: 30px;
    padding: 20px;
    background: rgba(255,255,0.05);
    border-radius: 10px;
}

.ending-quote strong {
    color: #ff6b6b;
}

.restart-btn {
    padding: 15px 50px;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    border: none;
    border-radius: 50px;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
}

/* 统计面板 */
.stats-panel {
    background: rgba(255,255,0.05);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 30px;
}

.stats-title {
    color: #00d2ff;
    margin-bottom: 15px;
}

.stats-list {
    list-style: none;
}

.stats-list li {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,0.1);
    display: flex;
    align-items: center;
    gap: 10px;
}

.stats-list li:last-child {
    border-bottom: none;
}

.stat-icon {
    font-size: 1.2rem;
}

/* 响应式 */
@media (max-width: 768px) {
    .start-screen h1 {
        font-size: 2rem;
    }

    .scene-title {
        font-size: 1.2rem;
    }

    .action-buttons {
        flex-direction: column;
    }
}
</style>
</head>
<body>

<!-- 开始界面 -->
<div class="start-screen" id="startScreen">
    <h1>小人的一天</h1>
    <p>一个普通工作日，如何一步步导致公司资产被窃取？</p>
    <p style="color: #666; font-size: 0.9rem; margin-bottom: 30px;">
        10个真实场景 · 10次日常选择 · 1条完整攻击链
    </p>
    <button class="start-btn" onclick="startGame()">开始体验</button>
</div>

<!-- 游戏主界面 -->
<div class="game-container" id="gameContainer">
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="step-info">
            <span id="currentStep">1</span>/10
            <span id="stepLabel">周一早晨</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 10%"></div>
        </div>
        <div class="risk-counter">
            风险值：<span id="riskScore">0</span>
        </div>
    </div>

    <!-- 场景卡片 -->
    <div class="scene-card" id="sceneCard">
        <div class="scene-header">
            <span class="scene-time" id="sceneTime">9:00 AM</span>
            <span class="scene-title" id="sceneTitle">设置密码</span>
        </div>

        <div class="scene-desc" id="sceneDesc">
            描述加载中...
        </div>

        <div class="character-area">
            <div class="character" id="characterEmoji">👨‍💻</div>
            <div class="action-text" id="actionText">准备开始新的一天...</div>
        </div>

        <div class="action-buttons" id="actionButtons">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 结局画面 -->
    <div class="ending-screen" id="endingScreen">
        <h2 class="ending-title">这不是一次错误操作</h2>

        <div class="stats-panel">
            <h3 class="stats-title">📊 你的选择回顾</h3>
            <ul class="stats-list" id="statsList">
                <!-- 动态生成 -->
            </ul>
        </div>

        <h3 style="color: #ff6b6b; margin-bottom: 20px;">🔍 攻击者视角</h3>

        <div class="timeline" id="timeline">
            <!-- 动态生成 -->
        </div>

        <div class="ending-quote">
            <strong>没有哪一步是"错误"的</strong><br>
            但它们连在一起，就出事了<br><br>
            你只是像平时一样工作<br>
